# Format, lint, typecheck, unit tests, then the build: the checks deploy.yml runs
# before it ships, on every push and pull request. Playtests need a browser and
# the running app, so they stay on Kim's machine. The Docker smoke test stays in
# the deploy, where the image is built anyway.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build pinpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: install
        run: npm ci

      - name: format check
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm test

      - name: build
        run: npm run build
